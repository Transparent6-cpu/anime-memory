<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#05050b">
<title>二次元记忆翻牌 · NEON MEMORY</title>
<style>
:root{
  --bg:#05050b;--cy:#00f0ff;--mg:#ff2bd6;--yl:#f9f871;--grn:#39ff14;
  --panel:rgba(13,13,24,.72);--line:rgba(0,240,255,.22);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;background:var(--bg);color:#f5f7ff;
  font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  overflow-x:hidden;
}
body::before{
  content:"";position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(60% 50% at 12% 0%,rgba(255,43,214,.18),transparent 65%),
    radial-gradient(55% 55% at 92% 100%,rgba(0,240,255,.15),transparent 65%),
    linear-gradient(rgba(0,240,255,.05) 1px,transparent 1px),
    linear-gradient(90deg,rgba(0,240,255,.05) 1px,transparent 1px);
  background-size:auto,auto,64px 64px,64px 64px;
  mask-image:radial-gradient(85% 85% at 50% 40%,#000 30%,transparent 100%);
  -webkit-mask-image:radial-gradient(85% 85% at 50% 40%,#000 30%,transparent 100%);
}
body::after{
  content:"";position:fixed;inset:0;z-index:1;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);
}
.app{position:relative;z-index:2;max-width:1180px;margin:0 auto;padding:clamp(14px,2.4vh,28px) clamp(14px,2.6vw,36px) 26px;
  min-height:100vh;display:flex;flex-direction:column}

/* ---------- 头部 ---------- */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap;
  border-bottom:1px solid var(--line);padding-bottom:10px}
.brand{display:flex;flex-direction:column;gap:4px}
.brand .k{font-family:"JetBrains Mono",ui-monospace,monospace;font-size:10px;letter-spacing:.32em;color:rgba(0,240,255,.7)}
.brand h1{margin:0;font-size:clamp(22px,3.4vw,40px);font-weight:900;letter-spacing:-.02em;line-height:1;
  text-shadow:0 0 18px rgba(255,43,214,.5),0 0 48px rgba(0,240,255,.3)}
.brand h1 em{font-style:normal;color:var(--cy)}
.stats{display:flex;align-items:center;gap:clamp(12px,2vw,28px)}
.stat{display:flex;flex-direction:column;gap:2px;align-items:flex-end}
.stat span{font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.22em;color:rgba(245,247,255,.42)}
.stat b{font-family:ui-monospace,monospace;font-size:clamp(15px,1.7vw,21px);font-weight:700;line-height:1;min-width:2.5ch;text-align:right}
.stat.hot b{color:var(--yl);text-shadow:0 0 14px rgba(249,248,113,.6)}
.icon-btn{
  border:1px solid rgba(0,240,255,.35);background:rgba(0,240,255,.08);color:#d9fbff;
  width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;display:grid;place-items:center;
  transition:background .2s,transform .2s}
.icon-btn:hover{background:rgba(0,240,255,.18);transform:translateY(-2px)}

/* ---------- 棋盘 ---------- */
.board-wrap{flex:1;display:grid;place-items:center;padding:clamp(10px,2vh,22px) 0}
.board{
  display:grid;gap:clamp(7px,1.1vw,14px);
  grid-template-columns:repeat(4,minmax(0,1fr));
  width:min(100%,880px);
}
.card{
  position:relative;aspect-ratio:3/4;border-radius:14px;cursor:pointer;
  perspective:900px;background:transparent;border:none;padding:0;
  transition:transform .18s cubic-bezier(.2,.9,.3,1.3);
}
.card:active{transform:scale(.97)}
.card .inner{
  position:absolute;inset:0;transform-style:preserve-3d;
  transition:transform .5s cubic-bezier(.4,.1,.2,1);border-radius:14px;
}
.card.flip .inner,.card.done .inner{transform:rotateY(180deg)}
.face{
  position:absolute;inset:0;border-radius:14px;overflow:hidden;backface-visibility:hidden;
  display:grid;place-items:center;
}
.back{
  background:linear-gradient(150deg,rgba(255,43,214,.22),rgba(0,240,255,.1)),#0b0b18;
  border:1px solid rgba(0,240,255,.3);
  box-shadow:0 0 0 1px rgba(255,255,255,.03) inset,0 10px 26px rgba(0,0,0,.5);
}
.back::before{
  content:"";position:absolute;inset:8px;border-radius:9px;
  border:1px dashed rgba(0,240,255,.22);
  background-image:radial-gradient(rgba(0,240,255,.22) 1px,transparent 1px);
  background-size:12px 12px;
}
.back span{
  position:relative;font-family:ui-monospace,monospace;font-size:clamp(28px,4.2vw,46px);font-weight:800;
  color:rgba(255,255,255,.85);text-shadow:0 0 16px rgba(255,43,214,.9),0 0 40px rgba(0,240,255,.5);
}
.front{
  transform:rotateY(180deg);background:#0a0a14;border:1px solid rgba(255,255,255,.12);
  box-shadow:0 12px 30px rgba(0,0,0,.55);
}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.front .tag{
  position:absolute;left:0;right:0;bottom:0;padding:26px 8px 8px;
  background:linear-gradient(180deg,transparent 0%,rgba(4,4,10,.62) 30%,rgba(4,4,10,.95) 70%);
  color:#f4f7ff;font-size:clamp(11px,1vw,14px);font-weight:800;text-align:center;letter-spacing:.03em;
  text-shadow:0 1px 4px #000,0 0 12px rgba(0,229,255,.35);
}
.card.done .front{border-color:rgba(57,255,20,.75);box-shadow:0 0 22px rgba(57,255,20,.45),0 12px 30px rgba(0,0,0,.5)}
.card.done{animation:pop .45s cubic-bezier(.2,.9,.3,1.5)}
@keyframes pop{0%{transform:scale(1)}45%{transform:scale(1.06)}100%{transform:scale(1)}}
.card.miss .front{border-color:rgba(255,59,92,.8);box-shadow:0 0 18px rgba(255,59,92,.5)}
.card.locked{cursor:default}

/* ---------- 底部 ---------- */
.foot{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;padding-top:8px}
.btn{
  border:none;cursor:pointer;font-family:inherit;font-weight:800;
  padding:11px 22px;border-radius:999px;font-size:14px;
  background:linear-gradient(120deg,var(--mg),#7a00ff 55%,var(--cy));color:#0a0616;
  box-shadow:0 0 0 1px rgba(255,255,255,.22) inset,0 8px 26px rgba(255,43,214,.38);
  transition:transform .2s,box-shadow .2s}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 0 1px rgba(255,255,255,.35) inset,0 12px 34px rgba(0,240,255,.4)}
.btn.ghost{background:transparent;color:#dbe6ff;border:1px solid rgba(0,240,255,.4);box-shadow:none}
.btn.ghost:hover{background:rgba(0,240,255,.12)}
.hint{font-family:ui-monospace,monospace;font-size:10.5px;letter-spacing:.12em;color:rgba(245,247,255,.4);
  display:flex;gap:12px;flex-wrap:wrap}
.combo{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(.6);z-index:20;
  font-size:clamp(34px,7vw,76px);font-weight:900;color:var(--yl);pointer-events:none;opacity:0;
  text-shadow:0 0 30px rgba(249,248,113,.8),0 0 90px rgba(255,43,214,.5);font-family:ui-monospace,monospace}
.combo.show{animation:combo .9s cubic-bezier(.2,.9,.3,1.4) forwards}
@keyframes combo{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}
  25%{opacity:1;transform:translate(-50%,-50%) scale(1.08)}
  75%{opacity:1;transform:translate(-50%,-58%) scale(1)}
  100%{opacity:0;transform:translate(-50%,-72%) scale(.95)}}

/* ---------- 结算 ---------- */
.overlay{
  position:fixed;inset:0;z-index:30;display:none;place-items:center;padding:20px;
  background:radial-gradient(60% 60% at 50% 45%,rgba(10,4,20,.86),rgba(3,3,8,.96));
  backdrop-filter:blur(6px)}
.overlay.show{display:grid;animation:fade .3s ease}
@keyframes fade{from{opacity:0}to{opacity:1}}
.result{
  width:min(560px,100%);border-radius:22px;padding:clamp(22px,3.4vw,38px);
  border:1px solid rgba(0,240,255,.3);
  background:linear-gradient(165deg,rgba(24,20,44,.96),rgba(8,8,18,.98));
  box-shadow:0 0 0 1px rgba(255,255,255,.04) inset,0 30px 90px rgba(0,0,0,.7),
    0 0 90px rgba(255,43,214,.18);
  text-align:center}
.result .k{font-family:ui-monospace,monospace;font-size:10px;letter-spacing:.34em;color:var(--cy)}
.result h2{margin:10px 0 4px;font-size:clamp(26px,4vw,40px);font-weight:900;letter-spacing:-.02em}
.result .rank{font-size:clamp(18px,2.4vw,26px);font-weight:900;color:var(--yl);
  text-shadow:0 0 22px rgba(249,248,113,.55);margin-bottom:16px}
.result .rows{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0 22px}
.result .row{padding:12px 8px;border-radius:12px;background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.08)}
.result .row span{display:block;font-family:ui-monospace,monospace;font-size:9px;letter-spacing:.18em;color:rgba(245,247,255,.45);margin-bottom:4px}
.result .row b{font-family:ui-monospace,monospace;font-size:clamp(18px,2.6vw,26px)}
.result .acts{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.newbest{display:inline-block;margin-bottom:10px;padding:4px 12px;border-radius:999px;
  font-size:11px;font-weight:800;letter-spacing:.14em;color:#05050b;background:var(--yl);
  box-shadow:0 0 22px rgba(249,248,113,.6)}

/* ---------- 小屏 ---------- */
@media (max-width:720px){
  .app{padding:12px 12px 20px}
  .top{gap:10px;padding-bottom:8px}
  .board{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .stats{gap:12px}
  .stat span{font-size:8px}
  .foot{justify-content:center}
  .hint{justify-content:center;font-size:9.5px}
}
@media (max-width:420px){
  .brand h1{font-size:20px}
  .board{gap:6px}
  .front .tag{font-size:9px;padding:12px 4px 5px}
}
@media (max-height:560px) and (orientation:landscape){
  .board{grid-template-columns:repeat(6,minmax(0,1fr));width:min(100%,900px)}
  .card{aspect-ratio:3/4}
  .brand h1{font-size:18px}
  .board-wrap{padding:6px 0}
}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="k">NEON MEMORY · 二次元记忆翻牌</div>
      <h1>找出成对的<em>她们</em></h1>
    </div>
    <div class="stats">
      <div class="stat"><span>TIME</span><b id="time">0:00</b></div>
      <div class="stat hot"><span>MOVES</span><b id="moves">0</b></div>
      <div class="stat"><span>PAIRS</span><b id="pairs">0/6</b></div>
      <button class="icon-btn" id="soundBtn" title="音效开关" aria-label="音效开关">🔊</button>
    </div>
  </header>

  <div class="board-wrap">
    <div class="board" id="board"></div>
  </div>

  <footer class="foot">
    <button class="btn" id="restart">重新开局 ↺</button>
    <div class="hint">
      <span>点击卡片翻开</span><span>·</span><span>全部配对即通关</span><span>·</span><span id="bestLine">最佳 —</span>
    </div>
  </footer>
</div>

<div class="combo" id="combo"></div>

<div class="overlay" id="overlay">
  <div class="result">
    <div class="k">MISSION CLEAR</div>
    <h2>全部配对成功</h2>
    <div class="rank" id="rank">S</div>
    <div id="bestTag"></div>
    <div class="rows">
      <div class="row"><span>TIME</span><b id="rTime">0:00</b></div>
      <div class="row"><span>MOVES</span><b id="rMoves">0</b></div>
      <div class="row"><span>SCORE</span><b id="rScore">0</b></div>
    </div>
    <div class="acts">
      <button class="btn" id="again">再来一局 →</button>
      <button class="btn ghost" id="closeOverlay">看看牌面</button>
    </div>
  </div>
</div>

const KEYS = Object.keys(ART);
const boardEl = document.getElementById('board');
const timeEl = document.getElementById('time');
const movesEl = document.getElementById('moves');
const pairsEl = document.getElementById('pairs');
const bestLineEl = document.getElementById('bestLine');
const overlay = document.getElementById('overlay');
const comboEl = document.getElementById('combo');

const state = {
  first: null, second: null, lock: false,
  moves: 0, matched: 0, combo: 0, score: 0,
  startAt: 0, elapsed: 0, timerId: 0, sound: true
};

/* ---------- 音效（WebAudio，无外部资源） ---------- */
let ac = null;
function beep(freq, dur, type, vol){
  if(!state.sound) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = type || 'sine'; o.frequency.value = freq;
    o.connect(g); g.connect(ac.destination);
    const t = ac.currentTime;
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.08, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.start(t); o.stop(t + dur + 0.02);
  }catch(e){}
}

/* ---------- 计时 ---------- */
function fmt(sec){
  const m = Math.floor(sec / 60), s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function elapsedSec(){
  const live = state.startAt ? Date.now() - state.startAt : 0;
  return Math.floor((state.elapsed + live) / 1000);
}
function tick(){ timeEl.textContent = fmt(elapsedSec()); }
function startClock(){
  clearInterval(state.timerId);
  state.startAt = Date.now();
  state.timerId = setInterval(tick, 250);
  tick();
}

/* ---------- 发牌 ---------- */
function shuffle(a){
  for(let i = a.length - 1; i > 0; i--){
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function newGame(){
  clearInterval(state.timerId);
  Object.assign(state, {first:null, second:null, lock:false, moves:0, matched:0,
    combo:0, score:0, elapsed:0, startAt:0});
  overlay.classList.remove('show');
  const deck = shuffle([...KEYS, ...KEYS]);
  boardEl.innerHTML = '';
  deck.forEach((key, i) => {
    const art = ART[key];
    const card = document.createElement('button');
    card.className = 'card';
    card.dataset.key = key;
    card.dataset.index = i;
    card.setAttribute('aria-label', '未翻开的卡片');
    card.innerHTML =
      '<div class="inner">' +
        '<div class="face back"><span>?</span></div>' +
        '<div class="face front">' +
          '<img src="' + art.card + '" alt="' + art.name + '" draggable="false">' +
          '<div class="tag">' + art.name + '</div>' +
        '</div>' +
      '</div>';
    card.addEventListener('click', () => flip(card));
    boardEl.appendChild(card);
  });
  movesEl.textContent = '0';
  pairsEl.textContent = '0/' + KEYS.length;
  timeEl.textContent = '0:00';
  startClock();
  renderBest();
}

/* ---------- 翻牌 ---------- */
function flip(card){
  if(state.lock) return;
  if(card.classList.contains('flip') || card.classList.contains('done')) return;
  card.classList.add('flip');
  card.setAttribute('aria-label', ART[card.dataset.key].name);
  beep(520, 0.08, 'triangle', 0.05);

  if(!state.first){ state.first = card; return; }

  state.second = card;
  state.moves++;
  movesEl.textContent = state.moves;
  state.lock = true;

  const a = state.first.dataset.key, b = card.dataset.key;
  if(a === b){
    setTimeout(() => {
      state.first.classList.add('done');
      state.second.classList.add('done');
      state.lock = false;
      state.first = state.second = null;
      state.matched++;
      state.combo++;
      state.score += 100 + state.combo * 25;
      pairsEl.textContent = state.matched + '/' + KEYS.length;
      beep(720 + state.combo * 60, 0.16, 'sine', 0.09);
      if(state.combo >= 2) showCombo('COMBO ×' + state.combo);
      if(state.matched === KEYS.length) win();
    }, 260);
  }else{
    state.combo = 0;
    state.score = Math.max(0, state.score - 10);
    state.first.classList.add('miss');
    card.classList.add('miss');
    beep(190, 0.16, 'sawtooth', 0.05);
    setTimeout(() => {
      [state.first, state.second].forEach(c => {
        c.classList.remove('flip', 'miss');
        c.setAttribute('aria-label', '未翻开的卡片');
      });
      state.first = state.second = null;
      state.lock = false;
    }, 780);
  }
}

function showCombo(text){
  comboEl.textContent = text;
  comboEl.classList.remove('show');
  void comboEl.offsetWidth;
  comboEl.classList.add('show');
}

/* ---------- 结算 ---------- */
const BEST_KEY = 'neon-memory-best-v1';
function getBest(){
  try{ return JSON.parse(localStorage.getItem(BEST_KEY) || 'null'); }catch(e){ return null; }
}
function renderBest(){
  const b = getBest();
  bestLineEl.textContent = b ? '最佳 ' + fmt(b.time) + ' · ' + b.moves + ' 步' : '最佳 —';
}
function rankOf(time, moves){
  if(time <= 40 && moves <= 14) return 'S+';
  if(time <= 60 && moves <= 18) return 'S';
  if(time <= 85) return 'A';
  if(time <= 115) return 'B';
  return 'C';
}
function win(){
  clearInterval(state.timerId);
  const sec = elapsedSec();
  state.startAt = 0;
  state.elapsed = sec * 1000;
  const perfect = state.moves === KEYS.length;
  state.score += perfect ? 300 : Math.max(0, 240 - state.moves * 6);
  const rank = perfect ? 'S+' : rankOf(sec, state.moves);

  document.getElementById('rTime').textContent = fmt(sec);
  document.getElementById('rMoves').textContent = state.moves;
  document.getElementById('rScore').textContent = state.score;
  document.getElementById('rank').textContent = rank + (perfect ? ' · 零失误' : '');

  const best = getBest();
  let isBest = false;
  if(!best || sec < best.time || (sec === best.time && state.moves < best.moves)){
    isBest = true;
    try{ localStorage.setItem(BEST_KEY, JSON.stringify({time: sec, moves: state.moves})); }catch(e){}
  }
  document.getElementById('bestTag').innerHTML = isBest
    ? '<span class="newbest">NEW RECORD</span>' : '';
  renderBest();
  overlay.classList.add('show');
  beep(660, 0.14, 'sine', 0.09);
  setTimeout(() => beep(880, 0.2, 'sine', 0.09), 140);
  setTimeout(() => beep(1180, 0.3, 'sine', 0.08), 320);
}

/* ---------- 交互绑定 ---------- */
document.getElementById('restart').addEventListener('click', newGame);
document.getElementById('again').addEventListener('click', newGame);
document.getElementById('closeOverlay').addEventListener('click', () => overlay.classList.remove('show'));
document.getElementById('soundBtn').addEventListener('click', e => {
  state.sound = !state.sound;
  e.currentTarget.textContent = state.sound ? '🔊' : '🔇';
  if(state.sound) beep(700, 0.1, 'sine', 0.07);
});
document.addEventListener('visibilitychange', () => {
  if(document.hidden){
    clearInterval(state.timerId);
    if(state.startAt){ state.elapsed += Date.now() - state.startAt; state.startAt = 0; }
  }else if(!overlay.classList.contains('show') && state.matched < KEYS.length){
    startClock();
  }
});

newGame();
</script>
</body>
</html>
